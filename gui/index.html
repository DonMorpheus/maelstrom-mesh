<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riptide</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header>
      <img src="/logo.jpg" alt="Riptide" class="logo">
      <div>
        <p class="kicker">ops overlay</p>
        <h1>RIPTIDE</h1>
        <p class="sub" id="mesh-meta">loading…</p>
      </div>
    </header>

    <section class="steer" id="steer">picking entry / exit…</section>

    <section class="cols">
      <div>
        <h2>entry</h2>
        <p class="hint">where you join the overlay (hub WAN :51820)</p>
        <div class="stack" id="entry-list"></div>
      </div>
      <div>
        <h2>exit</h2>
        <p class="hint">where traffic leaves — SOCKS on that host</p>
        <div class="stack" id="exit-list"></div>
      </div>
    </section>

    <section class="toolbar">
      <h2>enroll</h2>
      <form id="new-peer">
        <input name="name" placeholder="name" required autocomplete="off">
        <select name="os">
          <option value="linux">linux</option>
          <option value="windows">windows</option>
          <option value="android">android</option>
          <option value="darwin">darwin</option>
        </select>
        <button type="submit">enroll</button>
      </form>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
